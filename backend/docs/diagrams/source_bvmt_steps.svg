<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300">
<title>Scraper BVMT — les 3 volets indépendants</title>
<desc>sync_all() orchestre 3 sous-flux qui ne dépendent pas l'un de l'autre : statut de cotation, documents ESG, données de marché.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="740" height="300" fill="#FFFFFF"/>
