<svg xmlns="http://www.w3.org/2000/svg" width="780" height="264" viewBox="0 0 780 264">
<title>Cas particuliers — Base de données</title>
<desc>Le principe directeur : aucune donnée manquante n'est jamais reconstituée.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="780" height="264" fill="#FFFFFF"/>
<rect x="20" y="20" width="360" height="92" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="200" y="42" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#3C3489">Valeur absente</text><text x="200" y="64" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#534AB7">Reste NULL — jamais d'interpolation, de report ou de</text><text x="200" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#534AB7">moyenne</text><rect x="404" y="20" width="360" height="92" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="584" y="42" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#3C3489">Lecture auto-référentielle</text><text x="584" y="64" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#534AB7">Un calcul ne relit jamais sa propre sortie</text><text x="584" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#534AB7">(exclude_tableaux)</text><rect x="20" y="132" width="360" height="92" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="200" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#3C3489">Évolution du schéma</text><text x="200" y="176" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#534AB7">Migrations idempotentes — jamais de perte de données</text><text x="200" y="192" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#534AB7">existantes</text><rect x="404" y="132" width="360" height="92" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="584" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#3C3489">Deux KPI de même nom</text><text x="584" y="176" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#534AB7">Séparés par tableau d'origine — pas d'écrasement</text><text x="584" y="192" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#534AB7">silencieux</text>
</svg>