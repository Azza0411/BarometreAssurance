nt-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#534AB7">Valeurs stockées</text><path d="M625 116 L625 151 L200 151 L200 186" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="125" y="186" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="200" y="207.28" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Calcul</text><text x="200" y="226.32" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Ratios déduits</text><line x1="275" y1="214" x2="295" y2="214" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="295" y="186" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="370" y="207.28" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">API</text><text x="370" y="226.32" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">JSON servi</text><line x1="445" y1="214" x2="465" y2="214" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="465" y="186" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="540" y="207.28" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Frontend</text><text x="540" y="226.32" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Affichage</text>
