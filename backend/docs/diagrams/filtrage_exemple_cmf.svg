 y="294" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#854F0B">Dans les 10-11 dernières années</text><line x1="340" y1="308" x2="340" y2="332" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240" y="332" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="340" y="353.28" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#633806">Documents retenus</text><text x="340" y="372.32" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#854F0B">Ex. 9 documents gardés</text>
