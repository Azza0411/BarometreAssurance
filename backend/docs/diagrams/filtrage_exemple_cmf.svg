<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420">
<title>Exemple concret de filtrage — cas du scraper CMF</title>
<desc>Sur les 15 documents listés par le site, seuls ceux qui passent les 3 conditions (rapport annuel, daté du 31 décembre, dans les 10-11 dernières années) sont conservés.</desc>
