<svg viewBox="0 0 900 1180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Pipeline Collecte et Extraction</title>
<desc id="desc">Schéma du flux de données depuis les 5 sources officielles jusqu'aux KPI structurés, avec les mesures de robustesse ajoutées lors de l'audit.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#FFE600"/>
  </marker>
</defs>

<rect width="900" height="1180" fill="#15172a"/>

<!-- Header -->
<rect x="0" y="0" width="900" height="90" fill="#1e2138"/>
<rect x="0" y="88" width="900" height="2" fill="#FFE600"/>
<text x="40" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Pipeline Collecte → Extraction</text>
<text x="40" y="68" font-family="Arial, sans-serif" font-size="14" fill="#9aa0b8">FS Market Intelligence — parties vérifiées et robustifiées</text>
<text x="860" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFE600" text-anchor="end">EY</text>

<!-- ═══ STAGE 1 : SOURCES ═══ -->
<g>
  <rect x="60" y="130" width="780" height="90" rx="6" fill="#1e2138" stroke="#3a3f5c" stroke-width="1"/>
  <rect x="60" y="130" width="5" height="90" fill="#4a90e2"/>
  <text x="90" y="158" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#4a90e2">5 SOURCES OFFICIELLES</text>
  <text x="90" y="188" font-family="Arial, sans-serif" font-size="17" fill="#e8e8ec">CMF · FTUSA · CGA · INS · BVMT</text>
  <text x="90" y="209" font-family="Arial, sans-serif" font-size="12.5" fill="#9aa0b8">24 compagnies d'assurance tunisiennes — fenêtre glissante de 10 ans</text>
</g>

<line x1="450" y1="220" x2="450" y2="262" stroke="#FFE600" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="490" y="228" width="290" height="26" rx="13" fill="#1e2138" stroke="#FFE600" stroke-width="1"/>
<text x="635" y="246" font-family="Arial, sans-serif" font-size="12" fill="#FFE600" text-anchor="middle">retry × 3, backoff exponentiel</text>

<!-- ═══ STAGE 2 : COLLECTE ═══ -->
<g>
  <rect x="60" y="270" width="780" height="150" rx="6" fill="#1e2138" stroke="#3a3f5c" stroke-width="1"/>
  <rect x="60" y="270" width="5" height="150" fill="#FFE600"/>
  <text x="90" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">COLLECTE</text>
  <text x="90" y="324" font-family="Arial, sans-serif" font-size="13" fill="#c7c7ce">Selenium (portail CMF, widget JS dynamique) + Requests/BeautifulSoup (sources statiques)</text>
  <text x="90" y="346" font-family="Arial, sans-serif" font-size="13" fill="#c7c7ce">PDF + métadonnées → MySQL, idempotent (document_exists)</text>

  <!-- badges -->
  <rect x="90" y="366" width="150" height="26" rx="13" fill="#12331f" stroke="#4ADE80" stroke-width="1"/>
  <text x="165" y="384" font-family="Arial, sans-serif" font-size="11.5" fill="#4ADE80" text-anchor="middle">✓ Retry automatique</text>
  <rect x="254" y="366" width="240" height="26" rx="13" fill="#12331f" stroke="#4ADE80" stroke-width="1"/>
  <text x="374" y="384" font-family="Arial, sans-serif" font-size="11.5" fill="#4ADE80" text-anchor="middle">✓ Log JSON + rapport HTML / exécution</text>
  <rect x="508" y="366" width="270" height="26" rx="13" fill="#12331f" stroke="#4ADE80" stroke-width="1"/>
  <text x="643" y="384" font-family="Arial, sans-serif" font-size="11.5" fill="#4ADE80" text-anchor="middle">✓ Échec ≠ silence (source_empty)</text>
</g>

<line x1="450" y1="420" x2="450" y2="462" stroke="#FFE600" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="428" width="320" height="26" rx="13" fill="#1e2138" stroke="#FFE600" stroke-width="1"/>
<text x="620" y="446" font-family="Arial, sans-serif" font-size="12" fill="#FFE600" text-anchor="middle">PDF non structurés (jusqu'à 400 pages)</text>

<!-- ═══ STAGE 3 : EXTRACTION ═══ -->
<g>
  <rect x="60" y="470" width="780" height="180" rx="6" fill="#1e2138" stroke="#3a3f5c" stroke-width="1"/>
  <rect x="60" y="470" width="5" height="180" fill="#FFE600"/>
  <text x="90" y="500" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">EXTRACTION</text>
  <text x="90" y="524" font-family="Arial, sans-serif" font-size="13" fill="#c7c7ce">pdfplumber : reconstruction des tableaux par position des mots</text>
  <text x="90" y="546" font-family="Arial, sans-serif" font-size="13" fill="#c7c7ce">une regex dédiée par KPI, ancrée sur le plan comptable réglementaire</text>
  <text x="90" y="568" font-family="Arial, sans-serif" font-size="13" fill="#c7c7ce">~150 KPI / société : Bilan, Annexes 12/13, État de résultat, Présentation</text>

  <rect x="90" y="588" width="270" height="26" rx="13" fill="#12331f" stroke="#4ADE80" stroke-width="1"/>
  <text x="225" y="606" font-family="Arial, sans-serif" font-size="11.5" fill="#4ADE80" text-anchor="middle">✓ Garde-fou plausibilité (min/max)</text>
  <rect x="374" y="588" width="200" height="26" rx="13" fill="#12331f" stroke="#4ADE80" stroke-width="1"/>
  <text x="474" y="606" font-family="Arial, sans-serif" font-size="11.5" fill="#4ADE80" text-anchor="middle">✓ 34 tests unitaires</text>
  <rect x="588" y="588" width="192" height="26" rx="13" fill="#12331f" stroke="#4ADE80" stroke-width="1"/>
  <text x="684" y="606" font-family="Arial, sans-serif" font-size="11.5" fill="#4ADE80" text-anchor="middle">✓ Retry + logs JSON</text>

  <text x="90" y="634" font-family="Arial, sans-serif" font-size="12" fill="#9aa0b8" font-style="italic">Valeur suspecte (ex. n° de page) → rejetée : KPI marqué "manquant", jamais faussé</text>
</g>

<line x1="450" y1="650" x2="450" y2="692" stroke="#FFE600" stroke-width="2" marker-end="url(#arrow)"/>

<!-- ═══ STAGE 4 : RESULTAT ═══ -->
<g>
  <rect x="60" y="700" width="780" height="90" rx="6" fill="#1e2138" stroke="#3a3f5c" stroke-width="1"/>
  <rect x="60" y="700" width="5" height="90" fill="#639922"/>
  <text x="90" y="730" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8bc34a">KPI STRUCTURÉS</text>
  <text x="90" y="758" font-family="Arial, sans-serif" font-size="17" fill="#e8e8ec">SQLite (API) → dashboards, chatbot, prévisions</text>
  <text x="90" y="779" font-family="Arial, sans-serif" font-size="12.5" fill="#9aa0b8">24 compagnies × 10 ans × ~150 KPI, données exploitables et fiables</text>
</g>

<!-- Legend -->
<rect x="60" y="820" width="780" height="130" rx="6" fill="#1a1d33" stroke="#2a2e4d" stroke-width="1"/>
<text x="90" y="850" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Ce qui a été renforcé (audit + corrections)</text>
<circle cx="98" cy="872" r="4" fill="#4ADE80"/>
<text x="112" y="877" font-family="Arial, sans-serif" font-size="12.5" fill="#c7c7ce">Résilience réseau : chaque source retente automatiquement avant d'échouer</text>
<circle cx="98" cy="896" r="4" fill="#4ADE80"/>
<text x="112" y="901" font-family="Arial, sans-serif" font-size="12.5" fill="#c7c7ce">Visibilité : succès, "0 nouveauté" et échec réel ne sont plus confondus</text>
<circle cx="98" cy="920" r="4" fill="#4ADE80"/>
<text x="112" y="925" font-family="Arial, sans-serif" font-size="12.5" fill="#c7c7ce">Intégrité des données : une valeur aberrante devient "manquante", jamais fausse</text>
<circle cx="98" cy="944" r="4" fill="#4ADE80"/>
<text x="112" y="949" font-family="Arial, sans-serif" font-size="12.5" fill="#c7c7ce">Dette technique réduite : 3 fichiers morts supprimés, documentation resynchronisée</text>

<text x="450" y="1005" font-family="Arial, sans-serif" font-size="11" fill="#5a5f7a" text-anchor="middle">FS Market Intelligence · Projet de Fin d'Études · EY Tunisia · 2026</text>
</svg>
