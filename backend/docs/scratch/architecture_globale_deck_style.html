<title>Architecture Globale — Proposed Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#F4D925;
    --ink:#1B1B1E;
    --white:#FFFFFF;
    --muted:#C9C9CE;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:#e9e9e9;
    font-family:'Poppins','Segoe UI',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .slide{
    position:relative;
    width:1280px;
    max-width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    background:
      radial-gradient(ellipse 1000px 650px at 20% 10%, #7a7a82 0%, #4c4c53 45%, #29292e 100%);
    display:flex;
    flex-direction:column;
    padding:0;
    color:var(--white);
  }

  /* ── header, matching the deck's established chrome ── */
  .head{
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:28px 40px 0;
  }
  .head-left{ display:flex; align-items:center; }
  .chip{
    background:var(--yellow);
    border:2px solid var(--ink);
    color:var(--ink);
    font-weight:800;
    font-size:16px;
    padding:8px 14px;
    border-radius:2px;
  }
  .connector{ width:26px; height:2px; background:var(--ink); }
  .ribbon{
    position:relative;
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:19px;
    padding:11px 40px 11px 22px;
    clip-path:polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
    box-shadow:6px 6px 0 rgba(0,0,0,0.35);
  }
  .tag{
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:16px;
    padding:11px 22px;
    letter-spacing:0.01em;
  }

  /* ── main framed diagram ── */
  .frame{
    margin:26px auto 0;
    width:1180px;
    max-width:calc(100% - 80px);
    flex:1;
    background:rgba(255,255,255,0.05);
    border:1.5px solid rgba(255,255,255,0.55);
    border-radius:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:22px 30px 16px;
  }

  .flow{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    gap:0;
  }

  .col-end{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:150px;
    flex-shrink:0;
  }
  .col-end svg.big-icon{ width:80px; height:80px; }
  .col-end .cap{
    margin-top:10px;
    color:var(--yellow);
    font-weight:700;
    font-size:15px;
    text-align:center;
    line-height:1.25;
  }

  .arrow-zone{ width:56px; flex-shrink:0; display:flex; align-items:center; }
  .arrow-zone svg{ width:100%; height:14px; }

  .center-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
  }
  .banner{
    background:var(--yellow);
    color:var(--ink);
    font-weight:800;
    font-size:13px;
    letter-spacing:0.02em;
    padding:8px 22px;
    border-radius:3px;
    box-shadow:4px 4px 0 rgba(0,0,0,0.3);
  }
  .brackets{ width:280px; height:16px; }

  .grid2{
    display:grid;
    grid-template-columns:repeat(2, 155px);
    gap:10px;
  }
  .box{
    background:#2b2b30;
    border:1.5px solid rgba(255,255,255,0.7);
    border-radius:8px;
    padding:10px 8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .box svg{ width:26px; height:26px; flex-shrink:0; }
  .box .t{
    font-size:11px;
    font-weight:700;
    line-height:1.2;
    color:var(--white);
  }
  .box .s{
    font-size:8.5px;
    font-weight:500;
    color:var(--muted);
    font-style:italic;
  }

  /* ── satellite notes below the frame ── */
  .satellites{
    display:flex;
    justify-content:space-between;
    width:1180px;
    max-width:calc(100% - 80px);
    margin:10px auto 0;
    padding:0 60px;
  }
  .sat{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11.5px;
    color:var(--muted);
    font-style:italic;
  }
  .sat .dash{ width:20px; height:0; border-top:2px dashed var(--yellow); }
  .sat b{ color:var(--white); font-weight:700; font-style:normal; }

  .footer{
    text-align:center;
    font-size:19px;
    font-style:italic;
    color:var(--white);
    margin:14px 0 8px;
  }
  .pageno{
    position:absolute;
    bottom:14px; right:24px;
    font-weight:700;
    font-size:14px;
    color:var(--white);
  }
</style>

<div class="slide">
  <div class="head">
    <div class="head-left">
      <span class="chip">02</span>
      <span class="connector"></span>
      <span class="ribbon">Proposed solution</span>
    </div>
    <span class="tag">D . Architecture</span>
  </div>

  <div class="frame">
    <div class="flow">
      <div class="col-end">
        <svg class="big-icon" viewBox="0 0 100 100" fill="none" stroke="#FFFFFF" stroke-width="2">
          <path d="M20 55 q-8 -10 3 -18 q-5 -14 12 -16 q4 -12 18 -8 q10 -8 20 2 q12 -2 15 12 q10 6 2 18 q6 12 -8 16 q-2 10 -16 8 q-8 8 -18 0 q-14 4 -18 -6 q-12 0 -10 -12z"/>
          <path d="M32 50 q10 -6 20 2 q8 -8 20 0 M40 62 q8 -4 16 2" stroke-width="1.5"/>
        </svg>
        <div class="cap">Sources de<br/>données</div>
      </div>

      <div class="arrow-zone">
        <svg viewBox="0 0 100 14" preserveAspectRatio="none"><line x1="2" y1="7" x2="90" y2="7" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 5"/><path d="M84 2 L96 7 L84 12 Z" fill="#FFFFFF"/></svg>
      </div>

      <div class="center-col">
        <span class="banner">ENVIRONNEMENT DOCKER</span>
        <svg class="brackets" viewBox="0 0 280 16"><path d="M20 0 V8 H260 V0 M140 8 V16" stroke="#F4D925" stroke-width="1.6" fill="none"/></svg>
        <div class="grid2">
          <div class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="#7CD9A0" stroke-width="2"><path d="M10 4 v4 l-4 8a2.5 2.5 0 0 0 2 4h8a2.5 2.5 0 0 0 2 -4l-4 -8v-4" /><line x1="9" y1="4" x2="15" y2="4"/></svg>
            <div><div class="t">Backend</div><div class="s">Flask · API REST</div></div>
          </div>
          <div class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="#8DB4F7" stroke-width="2"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12a7 2.6 0 0 0 14 0V6"/><path d="M5 12a7 2.6 0 0 0 14 0"/></svg>
            <div><div class="t">MySQL 8</div><div class="s">:3306</div></div>
          </div>
          <div class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="#C4AEF5" stroke-width="2"><rect x="4" y="6" width="16" height="10" rx="4"/><path d="M9 16 v3 l4 -3z"/></svg>
            <div><div class="t">Chatbot IA</div><div class="s">assistant</div></div>
          </div>
          <div class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="#F0B36E" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
            <div><div class="t">Veille</div><div class="s">thread · 30 min</div></div>
          </div>
        </div>
      </div>

      <div class="arrow-zone">
        <svg viewBox="0 0 100 14" preserveAspectRatio="none"><line x1="2" y1="7" x2="90" y2="7" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 5"/><path d="M84 2 L96 7 L84 12 Z" fill="#FFFFFF"/></svg>
      </div>

      <div class="col-end">
        <svg class="big-icon" viewBox="0 0 100 100" fill="none">
          <rect x="14" y="20" width="72" height="46" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
          <path d="M30 58 v-16 M45 58 v-24 M60 58 v-10 M75 58 v-20" stroke="#F4D925" stroke-width="4" stroke-linecap="round"/>
          <circle cx="50" cy="78" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
          <path d="M50 74 v4 l3 2" stroke="#F4D925" stroke-width="1.8" fill="none"/>
        </svg>
        <div class="cap">Interface<br/>utilisateur</div>
      </div>
    </div>
  </div>

  <div class="satellites">
    <div class="sat"><span class="dash"></span>Pipeline d'extraction (batch, hors Docker) → <b>MySQL</b></div>
    <div class="sat">Chatbot → <b>Groq API</b> (LLM externe)<span class="dash"></span></div>
  </div>

  <div class="footer">- Architecture globale -</div>
  <div class="pageno">14</div>
</div>
