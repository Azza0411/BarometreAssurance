<title>Architecture Globale — Fond Sombre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:rgba(53,53,63,0.77);
    --panel:rgba(53,53,63,0.77);
    --ink:#F0F0EC;
    --muted:#B7B8C2;
    --hair:rgba(255,255,255,0.14);
    --title:#F4E7C1;
    --blue:#8DB4F7;
    --blue-soft:rgba(141,180,247,0.14);
    --green:#7CD9A0;
    --green-soft:rgba(124,217,160,0.14);
    --purple:#C4AEF5;
    --purple-soft:rgba(196,174,245,0.14);
    --orange:#F0B36E;
    --orange-soft:rgba(240,179,110,0.14);
    --neutral-soft:rgba(255,255,255,0.06);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:#26262e;
    color:var(--ink);
    font-family:'Barlow','Segoe UI',system-ui,sans-serif;
    padding:48px 24px 72px;
  }
  main{ max-width:1080px; margin:0 auto; }
  .fig-frame{
    background:var(--panel);
    border-radius:16px;
    padding:20px 24px 24px;
    overflow-x:auto;
  }
  svg{ display:block; width:100%; height:auto; max-width:100%; color:var(--ink); }
  figcaption{
    margin-top:14px;
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
    max-width:70ch;
  }
  .title{ font-family:'Playfair Display', Georgia, serif; font-size:26px; font-weight:700; fill:var(--title); }
  .box-title{ font-weight:700; font-size:14px; fill:var(--ink); }
  .box-sub{ font-weight:500; font-size:11px; fill:var(--muted); }
  .box-note{ font-weight:400; font-style:italic; font-size:9.5px; fill:var(--muted); }
  .group-label{ font-weight:700; font-size:11px; letter-spacing:0.04em; fill:var(--blue); }
  .edge-label{ font-size:10.5px; font-weight:500; fill:var(--muted); }
  .legend-title{ font-weight:700; font-size:12px; fill:var(--ink); }
  .legend-text{ font-size:11px; fill:var(--muted); }
</style>

<main>
  <div class="fig-frame">
    <svg viewBox="0 0 1040 560" role="img" aria-label="Architecture globale : le client web en React envoie des requêtes API REST vers le Backend Flask et vers le Chatbot ; le Backend échange en SQL avec MySQL ; un pipeline d'extraction externe insère des données dans MySQL ; le Chatbot appelle l'API externe Groq. Le Backend, MySQL et le Chatbot sont regroupés dans l'environnement Docker.">
      <defs>
        <marker id="v2d-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
        </marker>
      </defs>

      <text x="520" y="42" text-anchor="middle" class="title">Architecture globale</text>

      <!-- Clients -->
      <rect x="40" y="150" width="190" height="140" rx="14" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
      <text x="60" y="172" class="group-label">CLIENTS</text>
      <rect x="60" y="188" width="150" height="86" rx="10" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/>
      <rect x="112" y="200" width="46" height="32" rx="3" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
      <line x1="135" y1="232" x2="135" y2="240" stroke="var(--blue)" stroke-width="1.6"/>
      <line x1="122" y1="240" x2="148" y2="240" stroke="var(--blue)" stroke-width="1.6"/>
      <text x="135" y="254" text-anchor="middle" class="box-title" style="font-size:12px">Application Web</text>
      <text x="135" y="267" text-anchor="middle" class="box-sub">React.js</text>

      <!-- Docker environment -->
      <rect x="260" y="95" width="740" height="290" rx="16" fill="none" stroke="var(--blue)" stroke-width="1.4" stroke-dasharray="6 5"/>
      <text x="278" y="118" class="group-label">ENVIRONNEMENT DOCKER</text>

      <!-- Backend -->
      <rect x="290" y="150" width="230" height="180" rx="12" fill="var(--green-soft)" stroke="var(--green)" stroke-width="1.6"/>
      <path d="M 393 172 L 393 188 L 378 216 A 8 8 0 0 0 385 228 L 425 228 A 8 8 0 0 0 432 216 L 417 188 L 417 172 Z" fill="none" stroke="var(--green)" stroke-width="1.6"/>
      <line x1="388" y1="172" x2="422" y2="172" stroke="var(--green)" stroke-width="1.6"/>
      <line x1="382" y1="212" x2="428" y2="212" stroke="var(--green)" stroke-width="1.4"/>
      <text x="405" y="252" text-anchor="middle" class="box-title">Backend</text>
      <text x="405" y="270" text-anchor="middle" class="box-sub">Flask · API REST</text>
      <text x="405" y="298" text-anchor="middle" class="box-note">+ veille automatique</text>
      <text x="405" y="311" text-anchor="middle" class="box-note">(thread interne, 30 min)</text>

      <!-- MySQL -->
      <rect x="570" y="150" width="180" height="110" rx="12" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
      <ellipse cx="660" cy="172" rx="16" ry="6" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
      <path d="M 644 172 L 644 190 A 16 6 0 0 0 676 190 L 676 172" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
      <path d="M 644 181 A 16 6 0 0 0 676 181" fill="none" stroke="var(--blue)" stroke-width="1.2"/>
      <text x="660" y="216" text-anchor="middle" class="box-title">MySQL 8</text>
      <text x="660" y="233" text-anchor="middle" class="box-sub">:3306</text>

      <!-- Chatbot -->
      <rect x="800" y="150" width="180" height="110" rx="12" fill="var(--purple-soft)" stroke="var(--purple)" stroke-width="1.6"/>
      <rect x="870" y="168" width="40" height="26" rx="7" fill="none" stroke="var(--purple)" stroke-width="1.5"/>
      <path d="M 883 194 L 883 202 L 892 194 Z" fill="none" stroke="var(--purple)" stroke-width="1.5"/>
      <circle cx="880" cy="181" r="1.8" fill="var(--purple)"/>
      <circle cx="890" cy="181" r="1.8" fill="var(--purple)"/>
      <circle cx="900" cy="181" r="1.8" fill="var(--purple)"/>
      <text x="890" y="222" text-anchor="middle" class="box-title">Chatbot (IA)</text>
      <text x="890" y="239" text-anchor="middle" class="box-sub">assistant conversationnel</text>

      <!-- Pipeline (outside Docker) -->
      <rect x="570" y="420" width="180" height="90" rx="12" fill="var(--neutral-soft)" stroke="var(--muted)" stroke-width="1.4"/>
      <rect x="638" y="435" width="34" height="22" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
      <rect x="644" y="429" width="34" height="22" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
      <text x="660" y="480" text-anchor="middle" class="box-title" style="font-size:12.5px">Pipeline d'extraction</text>
      <text x="660" y="496" text-anchor="middle" class="box-sub">batch · hors Docker</text>

      <!-- Groq (external) -->
      <rect x="800" y="420" width="180" height="90" rx="12" fill="var(--neutral-soft)" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4"/>
      <path d="M 868 448 a 10 10 0 0 1 5 -18 a 13 13 0 0 1 25 -4 a 9 9 0 0 1 3 17 z" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
      <text x="890" y="480" text-anchor="middle" class="box-title" style="font-size:12.5px">Groq API</text>
      <text x="890" y="496" text-anchor="middle" class="box-sub">cloud · externe</text>

      <!-- Legend -->
      <rect x="40" y="420" width="460" height="90" rx="12" fill="none" stroke="var(--hair)" stroke-width="1.4"/>
      <text x="60" y="443" class="legend-title">Légende</text>
      <line x1="60" y1="463" x2="100" y2="463" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#v2d-arrow)"/>
      <text x="110" y="467" class="legend-text">Communication synchrone (API REST / SQL)</text>
      <line x1="60" y1="488" x2="100" y2="488" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#v2d-arrow)"/>
      <text x="110" y="492" class="legend-text">Appel externe / traitement en arrière-plan</text>

      <!-- arrows -->
      <line x1="230" y1="220" x2="286" y2="232" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#v2d-arrow)"/>
      <text x="258" y="203" text-anchor="middle" class="edge-label">API REST</text>

      <path d="M 210 150 C 210 96, 520 90, 796 150" fill="none" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#v2d-arrow)"/>
      <text x="500" y="85" text-anchor="middle" class="edge-label">API REST</text>

      <line x1="520" y1="215" x2="566" y2="205" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#v2d-arrow)"/>
      <line x1="566" y1="222" x2="520" y2="232" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#v2d-arrow)"/>
      <text x="543" y="196" text-anchor="middle" class="edge-label">SQL</text>

      <line x1="660" y1="420" x2="660" y2="264" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#v2d-arrow)"/>
      <text x="712" y="345" text-anchor="middle" class="edge-label">INSERT</text>
      <text x="712" y="358" text-anchor="middle" class="edge-label">(pymysql)</text>

      <line x1="890" y1="260" x2="890" y2="416" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#v2d-arrow)"/>
      <text x="943" y="345" text-anchor="middle" class="edge-label">requête LLM</text>
      <text x="943" y="358" text-anchor="middle" class="edge-label">(HTTPS)</text>
    </svg>
  </div>
  <figcaption>Trait plein = échange synchrone attendu (REST, SQL). Pointillé = appel externe ou traitement d'arrière-plan (pipeline batch hors Docker, appel au LLM Groq). Le Backend embarque aussi la veille automatique — un thread interne, pas un service séparé.</figcaption>
</main>
