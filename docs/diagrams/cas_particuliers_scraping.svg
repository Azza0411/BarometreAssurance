<svg xmlns="http://www.w3.org/2000/svg" width="780" height="488" viewBox="0 0 780 488">
<title>Cas particuliers — Scraping</title>
<desc>Tous les cas non standards rencontrés lors de la collecte, et ce qui se passe dans chacun.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="780" height="488" fill="#FFFFFF"/>
<rect x="20" y="20" width="360" height="92" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="200" y="42" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#712B13">Donnée non trouvée / filtrée</text><text x="200" y="64" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">Ignorée — retentée au prochain passage (pipeline</text><text x="200" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">hebdo)</text><rect x="404" y="20" width="360" height="92" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="584" y="42" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#712B13">Document déjà en base</text><text x="584" y="64" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">Ignoré — déduplication via document_exists()</text><rect x="20" y="132" width="360" height="92" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="200" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#712B13">Lien PDF invalide ou mort</text><text x="200" y="176" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">Vérifié avant l'enregistrement, ignoré si invalide</text><rect x="404" y="132" width="360" height="92" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="584" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#712B13">Erreur réseau passagère</text><text x="584" y="176" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">Nouvelle tentative automatique (2 à 3 essais selon la</text><text x="584" y="192" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">source)</text><rect x="20" y="244" width="360" height="92" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="200" y="266" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#712B13">Échec complet d'une source</text><text x="200" y="288" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">Erreur journalisée — les autres sources continuent</text><text x="200" y="304" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">normalement</text><rect x="404" y="244" width="360" height="92" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="584" y="266" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#712B13">Widget JS indisponible (CMF)</text><text x="584" y="288" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">Repli automatique sur le &lt;select&gt; HTML natif</text><rect x="20" y="356" width="360" height="92" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="200" y="378" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#712B13">Pagination cassée / page suivante introuvable</text><text x="200" y="400" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">Arrêt de la collecte pour cette société (garde-fou</text><text x="200" y="416" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#993C1D">max_pages)</text>
</svg>