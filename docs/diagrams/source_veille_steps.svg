<title>Veille — IlBoursa &amp; Atlas Magazine (api/routes/veille.py)</title>
<desc>sync_new_items() agrège les deux sources en parallèle via _build_veille(), puis détecte les nouveautés contre la base — distinct du cache mémoire utilisé par les routes live.</desc>
