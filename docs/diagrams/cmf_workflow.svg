<svg xmlns="http://www.w3.org/2000/svg" width="700" height="488" viewBox="0 0 700 488">
<title>Déroulé complet du scraper CMF</title>
<desc>7 étapes séquentielles. Les étapes 4 (Filtrage) et 6 (Déduplication) sont détaillées juste après dans des schémas dédiés.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="700" height="488" fill="#FFFFFF"/>
<rect x="190" y="30" width="320" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="350" y="49" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">1. Ouvrir Chrome</text><text x="350" y="66" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">navigateur invisible</text><line x1="350" y1="80" x2="350" y2="94" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="94" width="320" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="350" y="113" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">2. Sélectionner la société</text><text x="350" y="130" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">menu déroulant du portail</text><line x1="350" y1="144" x2="350" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="158" width="320" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="350" y="177" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">3. Lancer la recherche</text><text x="350" y="194" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">clic sur le bouton</text><line x1="350" y1="208" x2="350" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="222" width="320" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="350" y="241" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#633806">4. Filtrage</text><text x="350" y="258" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#854F0B">voir zoom plus bas</text><line x1="350" y1="272" x2="350" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="286" width="320" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="350" y="305" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">5. Vérifier le lien PDF</text><text x="350" y="322" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">le lien répond bien</text><line x1="350" y1="336" x2="350" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="350" width="320" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="350" y="369" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#085041">6. Déduplication</text><text x="350" y="386" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">voir zoom plus bas</text><line x1="350" y1="400" x2="350" y2="414" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="414" width="320" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="350" y="433" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">7. Enregistrer</text><text x="350" y="450" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">métadonnées seulement</text>
</svg>