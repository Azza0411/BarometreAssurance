00" stroke-width="1.2" stroke-dasharray="4,4"/><path d="M470 274 L506 274" fill="none" stroke="#8B7000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/><path d="M506 212 L530 212" fill="none" stroke="#8B7000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/><rect x="530" y="186" width="300" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="680" y="204" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#633806">PDF natif ou scanné ?</text><text x="680" y="223" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Bascule automatique vers l'OCR</text><path d="M506 278 L530 278" fill="none" stroke="#8B7000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/><rect x="530" y="252" width="300" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="680" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#633806">Français ou arabe (RTL) ?</text><text x="680" y="289" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Extracteur dédié (arabic_ocr_extractor.py)</text><path d="M506 344 L530 344" fill="none" stroke="#8B7000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/><rect x="530" y="318" width="300" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="680" y="336" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#633806">Valeur trouvée mais douteuse ?</text><text x="680" y="355" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Rejetée — reste NULL, jamais inventée</text>
