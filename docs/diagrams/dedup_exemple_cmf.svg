<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280">
<title>Exemple concret de déduplication — cas du scraper CMF</title>
<desc>Avant d'enregistrer un document, le programme vérifie s'il existe déjà en base pour cette société, cette source et cette année.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="680" height="280" fill="#FFFFFF"/>
<rect x="220" y="30" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="340" y="49" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Nouveau document trouvé</text><text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">ex. STAR 2022</text><line x1="340" y1="80" x2="340" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="170" y="104" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="125.28" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#085041">Vérification</text><text x="340" y="144.32" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">Existe déjà ? (société + source + année)</text><line x1="255" y1="160" x2="150" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text x="175" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">oui</text><rect x="60" y="200" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="150" y="219" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Ignoré</text><text x="150" y="236" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">déjà en base</text><line x1="425" y1="160" x2="530" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text x="490" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">non</text><rect x="440" y="200" width="200" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="540" y="219" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#085041">Enregistré</text><text x="540" y="236" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">métadonnées ajoutées</text>
</svg>