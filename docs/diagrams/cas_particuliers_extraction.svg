<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600">
<title>Cas particuliers — Extraction PDF</title>
<desc>Tous les cas non standards rencontrés lors de la lecture des PDF, et ce qui se passe dans chacun.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="780" height="600" fill="#FFFFFF"/>
<rect x="20" y="20" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="200" y="42" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">PDF natif vs scanné</text><text x="200" y="64" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Bascule automatique vers l'OCR</text><rect x="404" y="20" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="584" y="42" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">Texte natif présent mais police corrompue</text><text x="584" y="64" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">OCR forcé quand même — relit l'image, ignore le texte</text><rect x="20" y="132" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="200" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">Français vs arabe (RTL)</text><text x="200" y="176" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Extracteur dédié (lecture miroir + normalisation</text><text x="200" y="192" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Unicode)</text><rect x="404" y="132" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="584" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">Page pivotée (paysage dans un doc portrait)</text><text x="584" y="176" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Coordonnées reconverties pour rester alignées</text><rect x="20" y="244" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="200" y="266" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">Ancien vs nouveau format réglementaire (Takaful)</text><text x="200" y="288" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Détection automatique, bonne colonne retenue</text><rect x="404" y="244" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="584" y="266" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">Valeur hors plage plausible</text><text x="584" y="288" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Rejetée — reste NULL plutôt qu'un chiffre faux</text><rect x="20" y="356" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="200" y="378" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">Valeur non trouvée du tout</text><text x="200" y="400" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Reste NULL, jamais interpolée ou reconstituée</text><rect x="404" y="356" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="584" y="378" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">Doublure détectée (même ligne lue deux fois)</text><text x="584" y="400" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Invalidée, recalcul tenté depuis les composantes</text><rect x="20" y="468" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="200" y="490" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">Composant partiel manquant pour un calcul</text><text x="200" y="512" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Recalcul depuis ce qui est disponible, sinon NULL</text><rect x="404" y="468" width="360" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="584" y="490" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#633806">Bilan déséquilibré ou variation improbable</text><text x="584" y="512" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">Anomalie journalisée (visible dans Qualité), pas</text><text x="584" y="528" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#854F0B">bloquant</text>
</svg>