" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="285" y="156" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Calcul des KPI</text><line x1="360" y1="156" x2="380" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="380" y="134" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/><text x="455" y="156" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">API</text><line x1="530" y1="156" x2="550" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="550" y="134" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="625" y="156" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#085041">Plateforme (Frontend)</text>
