<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460">
<title>Schéma des tables de la base de données</title>
<desc>sources et cmf référencent les documents ; chaque document porte des kpi_values, avec une clé unique document+tableau+kpi pour éviter tout écrasement silencieux. 4 tables de suivi complètent le schéma.</desc>
