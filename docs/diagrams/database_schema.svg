rial, Helvetica, sans-serif" font-size="12" fill="#993C1D">chiffres extraits</text><text x="350" y="328" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#712B13">clé unique : document + tableau + kpi</text><line x1="350" y1="210" x2="350" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#444441">+ 4 tables de suivi / qualité</text><rect x="22" y="398" width="155" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="99.5" y="415" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444441">anomalies_detectees</text><rect x="189" y="398" width="155" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="266.5" y="415" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444441">notifications</text><rect x="356" y="398" width="155" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="433.5" y="415" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444441">actualites_vues</text><rect x="523" y="398" width="155" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="600.5" y="415" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444441">reglementation_vues</text>
