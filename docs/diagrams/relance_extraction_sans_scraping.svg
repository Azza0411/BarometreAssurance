<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
<title>Relancer l'extraction seule, sans re-scraper</title>
<desc>Exemple : un bug est corrigé dans l'extracteur du Bilan. Les 300 PDF sont déjà connus (table documents) — inutile de retourner sur le site web, on relit directement les PDF déjà repérés.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="720" height="380" fill="#FFFFFF"/>
<rect x="20" y="20" width="380" height="90" rx="14" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6,5"/><text x="210" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5F5E5A">déjà fait — pas besoin de refaire</text><rect x="40" y="45" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="115" y="67" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#444441">Site web</text><line x1="190" y1="67" x2="220" y2="67" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="220" y="45" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="300" y="67" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#444441">Scraping</text><path d="M300 89 L300 130 L300 150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="150" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="300" y="171.28" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0C447C">documents</text><text x="300" y="190.32" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">300 PDF déjà en base</text><line x1="300" y1="206" x2="300" y2="226" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="226" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="300" y="247.28" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#633806">Extraction</text><text x="300" y="266.32" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#854F0B">code corrigé, relancé</text><text x="430" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#854F0B">← relancer uniquement ça</text><line x1="300" y1="282" x2="300" y2="302" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="302" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="300" y="323.28" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#085041">kpi_values</text><text x="300" y="342.32" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">mis à jour, sans re-scraper</text>
</svg>