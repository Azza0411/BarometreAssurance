<title>Global Architecture — Proposed Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#F4D925;
    --ink:#1B1B1E;
    --muted:#6B6E76;
    --hair:#DCDCDA;
    --blue:#3266CC;
    --blue-soft:#EAF1FF;
    --green:#2E8B57;
    --green-soft:#EAF7EF;
    --purple:#7C5CD6;
    --purple-soft:#F1ECFC;
    --orange:#E08B2A;
    --orange-soft:#FDF1E3;
    --neutral-soft:#F3F4F6;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:#e9e9e9;
    font-family:'Barlow','Segoe UI',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .slide{
    position:relative;
    width:1280px;
    max-width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    background:
      radial-gradient(ellipse 1000px 650px at 25% 8%, #FFFFFF 0%, #F1F1EF 45%, #E2E2DF 100%);
    display:flex;
    flex-direction:column;
    padding:0;
    color:var(--ink);
  }

  .head{
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:24px 40px 0;
  }
  .head-left{ display:flex; align-items:center; }
  .chip{
    background:var(--yellow);
    border:2px solid var(--ink);
    color:var(--ink);
    font-weight:800;
    font-size:16px;
    padding:8px 14px;
    border-radius:2px;
  }
  .connector{ width:26px; height:2px; background:var(--ink); }
  .ribbon{
    position:relative;
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:19px;
    padding:11px 40px 11px 22px;
    clip-path:polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
    box-shadow:6px 6px 0 rgba(0,0,0,0.15);
  }
  .tag{
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:16px;
    padding:11px 22px;
    letter-spacing:0.01em;
  }

  .frame{
    margin:18px auto 0;
    width:1180px;
    max-width:calc(100% - 80px);
    flex:1;
    background:#FFFFFF;
    border:1px solid var(--hair);
    border-radius:20px;
    box-shadow:0 18px 40px -18px rgba(20,20,25,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px 20px;
    overflow:hidden;
  }
  .frame svg{ width:100%; height:100%; max-width:1000px; }

  .box-title{ font-weight:700; font-size:13.5px; fill:var(--ink); }
  .box-sub{ font-weight:500; font-size:10.5px; fill:var(--muted); }
  .group-label{ font-weight:700; font-size:11px; letter-spacing:0.04em; fill:var(--blue); }
  .edge-label{ font-size:10px; font-weight:500; fill:var(--muted); }
  .legend-title{ font-weight:700; font-size:12px; fill:var(--ink); }
  .legend-text{ font-size:10.5px; fill:var(--muted); }

  .footer{
    text-align:center;
    font-size:19px;
    font-style:italic;
    color:var(--ink);
    margin:10px 0 8px;
  }
  .pageno{
    position:absolute;
    bottom:14px; right:24px;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
  }
</style>

<div class="slide">
  <div class="head">
    <div class="head-left">
      <span class="chip">02</span>
      <span class="connector"></span>
      <span class="ribbon">Proposed solution</span>
    </div>
    <span class="tag">D . Architecture</span>
  </div>

  <div class="frame">
    <svg viewBox="0 0 980 650" role="img" aria-label="Global architecture, laid out as two straight aligned rows: Clients connects with a direct REST call to Backend and to Chatbot; Backend exchanges SQL with MySQL directly beside it; Monitoring sits directly below MySQL and writes alerts to it every 30 minutes; a batch pipeline outside Docker sits directly beside MySQL and inserts data into it; Chatbot sits above Groq and calls it as an external LLM. Backend, MySQL, Chatbot and Monitoring are grouped inside the Docker environment.">
      <defs>
        <marker id="cc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
        </marker>
      </defs>

      <!-- Clients (tall, spans both rows) -->
      <rect x="40" y="120" width="170" height="310" rx="14" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
      <text x="55" y="142" class="group-label">CLIENTS</text>
      <rect x="60" y="230" width="130" height="90" rx="10" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/>
      <rect x="105" y="242" width="40" height="28" rx="3" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
      <line x1="125" y1="270" x2="125" y2="277" stroke="var(--blue)" stroke-width="1.6"/>
      <line x1="114" y1="277" x2="136" y2="277" stroke="var(--blue)" stroke-width="1.6"/>
      <text x="125" y="292" text-anchor="middle" class="box-title" style="font-size:12px">Web App</text>
      <text x="125" y="305" text-anchor="middle" class="box-sub">React.js</text>

      <!-- Docker environment -->
      <rect x="250" y="95" width="430" height="365" rx="16" fill="none" stroke="var(--blue)" stroke-width="1.4" stroke-dasharray="6 5"/>
      <text x="668" y="118" text-anchor="end" class="group-label">DOCKER ENVIRONMENT</text>

      <!-- Backend -->
      <rect x="280" y="120" width="170" height="140" rx="12" fill="var(--green-soft)" stroke="var(--green)" stroke-width="1.6"/>
      <path d="M 358 142 L 358 156 L 345 180 A 7 7 0 0 0 351 191 L 384 191 A 7 7 0 0 0 390 180 L 377 156 L 377 142 Z" fill="none" stroke="var(--green)" stroke-width="1.6"/>
      <line x1="354" y1="142" x2="381" y2="142" stroke="var(--green)" stroke-width="1.6"/>
      <text x="365" y="222" text-anchor="middle" class="box-title">Backend</text>
      <text x="365" y="238" text-anchor="middle" class="box-sub">Flask · REST API</text>

      <!-- MySQL -->
      <rect x="490" y="120" width="170" height="140" rx="12" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
      <ellipse cx="575" cy="152" rx="15" ry="5.5" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
      <path d="M 560 152 L 560 168 A 15 5.5 0 0 0 590 168 L 590 152" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
      <path d="M 560 160 A 15 5.5 0 0 0 590 160" fill="none" stroke="var(--blue)" stroke-width="1.2"/>
      <text x="575" y="222" text-anchor="middle" class="box-title">MySQL 8</text>
      <text x="575" y="238" text-anchor="middle" class="box-sub">:3306</text>

      <!-- Chatbot -->
      <rect x="280" y="290" width="170" height="140" rx="12" fill="var(--purple-soft)" stroke="var(--purple)" stroke-width="1.6"/>
      <rect x="335" y="312" width="40" height="26" rx="7" fill="none" stroke="var(--purple)" stroke-width="1.5"/>
      <path d="M 348 338 L 348 346 L 357 338 Z" fill="none" stroke="var(--purple)" stroke-width="1.5"/>
      <circle cx="345" cy="325" r="1.7" fill="var(--purple)"/>
      <circle cx="355" cy="325" r="1.7" fill="var(--purple)"/>
      <circle cx="365" cy="325" r="1.7" fill="var(--purple)"/>
      <text x="365" y="392" text-anchor="middle" class="box-title">Chatbot (AI)</text>
      <text x="365" y="408" text-anchor="middle" class="box-sub">conversational assistant</text>

      <!-- Monitoring -->
      <rect x="490" y="290" width="170" height="140" rx="12" fill="var(--orange-soft)" stroke="var(--orange)" stroke-width="1.6"/>
      <circle cx="575" cy="322" r="14" fill="none" stroke="var(--orange)" stroke-width="1.6"/>
      <path d="M 575 312 v 10 l 8 5" stroke="var(--orange)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <text x="575" y="392" text-anchor="middle" class="box-title">Monitoring</text>
      <text x="575" y="408" text-anchor="middle" class="box-sub">news &amp; alerts</text>

      <!-- Pipeline (outside, right of MySQL) -->
      <rect x="740" y="120" width="190" height="140" rx="12" fill="var(--neutral-soft)" stroke="var(--muted)" stroke-width="1.4"/>
      <rect x="810" y="136" width="34" height="22" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
      <rect x="816" y="130" width="34" height="22" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
      <text x="835" y="222" text-anchor="middle" class="box-title" style="font-size:12.5px">Extraction Pipeline</text>
      <text x="835" y="238" text-anchor="middle" class="box-sub">batch · outside Docker</text>

      <!-- Groq (outside, below Chatbot) -->
      <rect x="280" y="520" width="170" height="110" rx="12" fill="var(--neutral-soft)" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4"/>
      <path d="M 348 552 a 9 9 0 0 1 4.5 -16 a 12 12 0 0 1 23 -4 a 8 8 0 0 1 2.5 16 z" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
      <text x="365" y="590" text-anchor="middle" class="box-title" style="font-size:12.5px">Groq API</text>
      <text x="365" y="606" text-anchor="middle" class="box-sub">cloud · external</text>

      <!-- Legend -->
      <rect x="40" y="520" width="210" height="110" rx="12" fill="none" stroke="var(--hair)" stroke-width="1.4"/>
      <text x="58" y="545" class="legend-title">Legend</text>
      <line x1="58" y1="568" x2="92" y2="568" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cc-arrow)"/>
      <text x="98" y="571" class="legend-text">Synchronous (REST / SQL)</text>
      <line x1="58" y1="592" x2="92" y2="592" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#cc-arrow)"/>
      <text x="98" y="595" class="legend-text">Asynchronous / external</text>

      <!-- arrows: all straight, short, axis-aligned -->
      <line x1="210" y1="185" x2="276" y2="185" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cc-arrow)"/>
      <text x="243" y="176" text-anchor="middle" class="edge-label">REST API</text>

      <line x1="210" y1="355" x2="276" y2="355" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cc-arrow)"/>
      <text x="243" y="346" text-anchor="middle" class="edge-label">REST API</text>

      <line x1="450" y1="185" x2="486" y2="185" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cc-arrow)"/>
      <line x1="486" y1="202" x2="450" y2="202" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cc-arrow)"/>
      <text x="468" y="176" text-anchor="middle" class="edge-label">SQL</text>

      <line x1="575" y1="286" x2="575" y2="264" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cc-arrow)"/>
      <text x="440" y="272" text-anchor="end" class="edge-label">writes alerts</text>
      <text x="440" y="284" text-anchor="end" class="edge-label">every 30 min</text>

      <line x1="736" y1="185" x2="664" y2="185" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cc-arrow)"/>
      <text x="700" y="176" text-anchor="middle" class="edge-label" style="font-size:9px">INSERT</text>
      <text x="700" y="207" text-anchor="middle" class="edge-label" style="font-size:9px">(pymysql)</text>

      <line x1="365" y1="434" x2="365" y2="516" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cc-arrow)"/>
      <text x="435" y="470" text-anchor="middle" class="edge-label">LLM request</text>
      <text x="435" y="482" text-anchor="middle" class="edge-label">(HTTPS)</text>
    </svg>
  </div>

  <div class="footer">- Global Architecture -</div>
  <div class="pageno">14</div>
</div>
