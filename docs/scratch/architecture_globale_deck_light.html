<title>Global Architecture — Proposed Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#F4D925;
    --ink:#1B1B1E;
    --muted:#6B6E76;
    --hair:#DCDCDA;
    --title:#1F3A63;
    --blue:#3266CC;
    --blue-soft:#EAF1FF;
    --green:#2E8B57;
    --green-soft:#EAF7EF;
    --purple:#7C5CD6;
    --purple-soft:#F1ECFC;
    --orange:#E08B2A;
    --orange-soft:#FDF1E3;
    --neutral-soft:#F3F4F6;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:#e9e9e9;
    font-family:'Barlow','Segoe UI',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .slide{
    position:relative;
    width:1280px;
    max-width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    background:
      radial-gradient(ellipse 1000px 650px at 25% 8%, #FFFFFF 0%, #F1F1EF 45%, #E2E2DF 100%);
    display:flex;
    flex-direction:column;
    padding:0;
    color:var(--ink);
  }

  .head{
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:26px 40px 0;
  }
  .head-left{ display:flex; align-items:center; }
  .chip{
    background:var(--yellow);
    border:2px solid var(--ink);
    color:var(--ink);
    font-weight:800;
    font-size:16px;
    padding:8px 14px;
    border-radius:2px;
  }
  .connector{ width:26px; height:2px; background:var(--ink); }
  .ribbon{
    position:relative;
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:19px;
    padding:11px 40px 11px 22px;
    clip-path:polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
    box-shadow:6px 6px 0 rgba(0,0,0,0.15);
  }
  .tag{
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:16px;
    padding:11px 22px;
    letter-spacing:0.01em;
  }

  .frame{
    margin:22px auto 0;
    width:1180px;
    max-width:calc(100% - 80px);
    flex:1;
    background:#FFFFFF;
    border:1px solid var(--hair);
    border-radius:20px;
    box-shadow:0 18px 40px -18px rgba(20,20,25,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px 26px;
    overflow:hidden;
  }
  .frame svg{ width:100%; height:100%; max-width:1000px; }

  .box-title{ font-weight:700; font-size:13.5px; fill:var(--ink); }
  .box-sub{ font-weight:500; font-size:10.5px; fill:var(--muted); }
  .group-label{ font-weight:700; font-size:11px; letter-spacing:0.04em; fill:var(--blue); }
  .edge-label{ font-size:10px; font-weight:500; fill:var(--muted); }
  .legend-title{ font-weight:700; font-size:12px; fill:var(--ink); }
  .legend-text{ font-size:10.5px; fill:var(--muted); }

  .footer{
    text-align:center;
    font-size:19px;
    font-style:italic;
    color:var(--ink);
    margin:12px 0 8px;
  }
  .pageno{
    position:absolute;
    bottom:14px; right:24px;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
  }
</style>

<div class="slide">
  <div class="head">
    <div class="head-left">
      <span class="chip">02</span>
      <span class="connector"></span>
      <span class="ribbon">Proposed solution</span>
    </div>
    <span class="tag">D . Architecture</span>
  </div>

  <div class="frame">
    <svg viewBox="0 0 1000 610" role="img" aria-label="Global architecture: the React web client calls the Flask Backend and the Chatbot over REST; the Backend exchanges SQL with MySQL; Monitoring writes alerts to MySQL every 30 minutes; a batch pipeline outside Docker inserts data into MySQL; the Chatbot calls the external Groq API. Backend, MySQL, Chatbot and Monitoring are grouped inside the Docker environment.">
      <defs>
        <marker id="cl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
        </marker>
      </defs>

      <!-- Clients -->
      <rect x="40" y="110" width="190" height="140" rx="14" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
      <text x="60" y="132" class="group-label">CLIENTS</text>
      <rect x="60" y="148" width="150" height="86" rx="10" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/>
      <rect x="112" y="160" width="46" height="32" rx="3" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
      <line x1="135" y1="192" x2="135" y2="200" stroke="var(--blue)" stroke-width="1.6"/>
      <line x1="122" y1="200" x2="148" y2="200" stroke="var(--blue)" stroke-width="1.6"/>
      <text x="135" y="214" text-anchor="middle" class="box-title" style="font-size:12px">Web App</text>
      <text x="135" y="227" text-anchor="middle" class="box-sub">React.js</text>

      <!-- Docker environment -->
      <rect x="260" y="55" width="670" height="380" rx="16" fill="none" stroke="var(--blue)" stroke-width="1.4" stroke-dasharray="6 5"/>
      <text x="910" y="78" text-anchor="end" class="group-label">DOCKER ENVIRONMENT</text>

      <!-- Backend -->
      <rect x="290" y="110" width="210" height="230" rx="12" fill="var(--green-soft)" stroke="var(--green)" stroke-width="1.6"/>
      <path d="M 383 148 L 383 164 L 368 192 A 8 8 0 0 0 375 204 L 415 204 A 8 8 0 0 0 422 192 L 407 164 L 407 148 Z" fill="none" stroke="var(--green)" stroke-width="1.6"/>
      <line x1="378" y1="148" x2="412" y2="148" stroke="var(--green)" stroke-width="1.6"/>
      <line x1="372" y1="188" x2="418" y2="188" stroke="var(--green)" stroke-width="1.4"/>
      <text x="395" y="228" text-anchor="middle" class="box-title">Backend</text>
      <text x="395" y="246" text-anchor="middle" class="box-sub">Flask · REST API</text>

      <!-- MySQL -->
      <rect x="530" y="110" width="170" height="110" rx="12" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
      <ellipse cx="615" cy="132" rx="15" ry="5.5" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
      <path d="M 600 132 L 600 148 A 15 5.5 0 0 0 630 148 L 630 132" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
      <path d="M 600 140 A 15 5.5 0 0 0 630 140" fill="none" stroke="var(--blue)" stroke-width="1.2"/>
      <text x="615" y="175" text-anchor="middle" class="box-title">MySQL 8</text>
      <text x="615" y="191" text-anchor="middle" class="box-sub">:3306</text>

      <!-- Chatbot -->
      <rect x="530" y="260" width="170" height="110" rx="12" fill="var(--purple-soft)" stroke="var(--purple)" stroke-width="1.6"/>
      <rect x="590" y="278" width="40" height="26" rx="7" fill="none" stroke="var(--purple)" stroke-width="1.5"/>
      <path d="M 603 304 L 603 312 L 612 304 Z" fill="none" stroke="var(--purple)" stroke-width="1.5"/>
      <circle cx="600" cy="291" r="1.7" fill="var(--purple)"/>
      <circle cx="610" cy="291" r="1.7" fill="var(--purple)"/>
      <circle cx="620" cy="291" r="1.7" fill="var(--purple)"/>
      <text x="615" y="332" text-anchor="middle" class="box-title">Chatbot (AI)</text>
      <text x="615" y="348" text-anchor="middle" class="box-sub">conversational assistant</text>

      <!-- Monitoring -->
      <rect x="730" y="260" width="170" height="110" rx="12" fill="var(--orange-soft)" stroke="var(--orange)" stroke-width="1.6"/>
      <circle cx="815" cy="292" r="14" fill="none" stroke="var(--orange)" stroke-width="1.6"/>
      <path d="M 815 282 v 10 l 8 5" stroke="var(--orange)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <text x="815" y="332" text-anchor="middle" class="box-title">Monitoring</text>
      <text x="815" y="348" text-anchor="middle" class="box-sub">news &amp; alerts</text>

      <!-- Pipeline (outside) -->
      <rect x="290" y="460" width="210" height="90" rx="12" fill="var(--neutral-soft)" stroke="var(--muted)" stroke-width="1.4"/>
      <rect x="358" y="476" width="34" height="22" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
      <rect x="364" y="470" width="34" height="22" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
      <text x="395" y="520" text-anchor="middle" class="box-title" style="font-size:12.5px">Extraction Pipeline</text>
      <text x="395" y="536" text-anchor="middle" class="box-sub">batch · outside Docker</text>

      <!-- Groq (external) -->
      <rect x="610" y="460" width="210" height="90" rx="12" fill="var(--neutral-soft)" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4"/>
      <path d="M 688 488 a 10 10 0 0 1 5 -18 a 13 13 0 0 1 25 -4 a 9 9 0 0 1 3 17 z" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
      <text x="715" y="520" text-anchor="middle" class="box-title" style="font-size:12.5px">Groq API</text>
      <text x="715" y="536" text-anchor="middle" class="box-sub">cloud · external</text>

      <!-- Legend -->
      <rect x="40" y="460" width="210" height="90" rx="12" fill="none" stroke="var(--hair)" stroke-width="1.4"/>
      <text x="58" y="483" class="legend-title">Legend</text>
      <line x1="58" y1="503" x2="92" y2="503" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cl-arrow)"/>
      <text x="98" y="506" class="legend-text">Synchronous (REST / SQL)</text>
      <line x1="58" y1="525" x2="92" y2="525" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#cl-arrow)"/>
      <text x="98" y="528" class="legend-text">Asynchronous / external</text>

      <!-- arrows -->
      <line x1="230" y1="180" x2="286" y2="190" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cl-arrow)"/>
      <text x="255" y="165" text-anchor="middle" class="edge-label">REST API</text>

      <path d="M 230 240 C 235 460, 460 425, 600 374" fill="none" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cl-arrow)"/>
      <text x="410" y="410" text-anchor="middle" class="edge-label">REST API</text>

      <line x1="500" y1="165" x2="526" y2="165" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cl-arrow)"/>
      <line x1="526" y1="182" x2="500" y2="182" stroke="var(--muted)" stroke-width="1.8" marker-end="url(#cl-arrow)"/>
      <text x="513" y="156" text-anchor="middle" class="edge-label">SQL</text>

      <path d="M 802 260 C 780 240, 745 222, 704 216" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cl-arrow)"/>
      <text x="770" y="202" text-anchor="middle" class="edge-label">writes alerts</text>
      <text x="770" y="214" text-anchor="middle" class="edge-label">· every 30 min</text>

      <path d="M 330 460 C 258 420, 256 280, 260 120 C 262 78, 400 76, 526 110" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cl-arrow)"/>
      <text x="255" y="360" text-anchor="middle" class="edge-label">INSERT</text>
      <text x="255" y="372" text-anchor="middle" class="edge-label">(pymysql)</text>

      <path d="M 660 370 C 675 410, 700 435, 712 456" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cl-arrow)"/>
      <text x="700" y="420" text-anchor="middle" class="edge-label">LLM request</text>
      <text x="700" y="432" text-anchor="middle" class="edge-label">(HTTPS)</text>
    </svg>
  </div>

  <div class="footer">- Global Architecture -</div>
  <div class="pageno">14</div>
</div>
