<title>Architecture Globale — Style Icônes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#F2D06B;
    --card-bg:#FBFAF7;
    --ink:#1B1B1E;
    --muted:#6B6B72;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:#e9e9e9;
    font-family:'Barlow','Segoe UI',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .slide{
    position:relative;
    width:1280px;
    max-width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, #75757d 0%, #4c4c53 45%, #2c2c31 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 40px 0;
  }

  h1{
    margin:0;
    font-size:34px;
    font-weight:900;
    letter-spacing:0.03em;
    color:#FFFFFF;
    text-align:center;
  }
  h2{
    margin:6px 0 0;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.28em;
    color:var(--gold);
    text-align:center;
  }

  .cards{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:20px;
    margin-top:56px;
    flex-wrap:nowrap;
    width:100%;
  }

  .card{
    position:relative;
    flex:1 1 0;
    min-width:0;
    max-width:200px;
    aspect-ratio:180/230;
    background:var(--card-bg);
    border-radius:16px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.4) inset,
      0 0 26px 4px rgba(242,208,107,0.35),
      0 14px 24px -8px rgba(0,0,0,0.45);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 14px 18px;
  }

  .badge{
    position:absolute;
    top:-10px; left:-10px;
    width:38px; height:38px;
    background:#F6F1E3;
    border:1.5px solid var(--ink);
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:14px;
    color:var(--ink);
  }

  .icon{ width:64px; height:64px; margin-bottom:14px; flex-shrink:0; }

  .label{
    margin-top:auto;
    text-align:center;
    font-weight:800;
    font-size:13.5px;
    line-height:1.25;
    color:var(--ink);
  }
</style>

<div class="slide">
  <h1>ARCHITECTURE GLOBALE</h1>
  <h2>VUE D'ENSEMBLE DE LA PLATEFORME</h2>

  <div class="cards">

    <div class="card">
      <span class="badge">01</span>
      <svg class="icon" viewBox="0 0 64 64" fill="none">
        <rect x="10" y="12" width="44" height="30" rx="4" fill="#EAF1FF" stroke="#3266CC" stroke-width="2.2"/>
        <path d="M20 42 L44 42" stroke="#3266CC" stroke-width="2.2"/>
        <path d="M32 42 L32 50 M24 50 L40 50" stroke="#3266CC" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="32" cy="27" r="7" fill="#3266CC"/>
        <path d="M25 27a7 7 0 0 1 14 0" stroke="#EAF1FF" stroke-width="1.6" fill="none"/>
      </svg>
      <div class="label">Application Web<br/>(React)</div>
    </div>

    <div class="card">
      <span class="badge">02</span>
      <svg class="icon" viewBox="0 0 64 64" fill="none">
        <rect x="14" y="10" width="36" height="44" rx="6" fill="#EAF7EF" stroke="#2E8B57" stroke-width="2.2"/>
        <circle cx="32" cy="32" r="9" fill="none" stroke="#2E8B57" stroke-width="2.2"/>
        <path d="M32 20 v4 M32 40 v4 M20 32 h4 M40 32 h4 M23.5 23.5 l2.8 2.8 M37.7 37.7 l2.8 2.8 M40.5 23.5 l-2.8 2.8 M26.3 37.7 l-2.8 2.8" stroke="#2E8B57" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div class="label">Backend<br/>(Flask API)</div>
    </div>

    <div class="card">
      <span class="badge">03</span>
      <svg class="icon" viewBox="0 0 64 64" fill="none">
        <ellipse cx="32" cy="16" rx="17" ry="6.5" fill="#E4F7F8" stroke="#1E96A8" stroke-width="2.2"/>
        <path d="M15 16 v20 a17 6.5 0 0 0 34 0 v-20" fill="#E4F7F8" stroke="#1E96A8" stroke-width="2.2"/>
        <path d="M15 26 a17 6.5 0 0 0 34 0" fill="none" stroke="#1E96A8" stroke-width="1.8"/>
        <path d="M15 36 a17 6.5 0 0 0 34 0" fill="none" stroke="#1E96A8" stroke-width="1.8"/>
      </svg>
      <div class="label">Base de données<br/>(MySQL)</div>
    </div>

    <div class="card">
      <span class="badge">04</span>
      <svg class="icon" viewBox="0 0 64 64" fill="none">
        <rect x="12" y="14" width="40" height="26" rx="9" fill="#F1ECFC" stroke="#7C5CD6" stroke-width="2.2"/>
        <path d="M26 40 l0 8 l10 -8 z" fill="#F1ECFC" stroke="#7C5CD6" stroke-width="2.2"/>
        <circle cx="24" cy="27" r="2" fill="#7C5CD6"/>
        <circle cx="32" cy="27" r="2" fill="#7C5CD6"/>
        <circle cx="40" cy="27" r="2" fill="#7C5CD6"/>
      </svg>
      <div class="label">Assistant IA<br/>(Chatbot)</div>
    </div>

    <div class="card">
      <span class="badge">05</span>
      <svg class="icon" viewBox="0 0 64 64" fill="none">
        <rect x="14" y="18" width="28" height="20" rx="3" fill="#FDF1E3" stroke="#E08B2A" stroke-width="2.2"/>
        <rect x="20" y="12" width="28" height="20" rx="3" fill="#FDF1E3" stroke="#E08B2A" stroke-width="2.2"/>
        <path d="M25 20 h18 M25 25 h18" stroke="#E08B2A" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M28 48 v-8 M36 48 v-8 M22 48 h20" stroke="#E08B2A" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div class="label">Pipeline<br/>d'extraction</div>
    </div>

    <div class="card">
      <span class="badge">06</span>
      <svg class="icon" viewBox="0 0 64 64" fill="none">
        <path d="M20 40 a9 9 0 0 1 4 -17 a12 12 0 0 1 23 -3 a8 8 0 0 1 3 20 z" fill="#FBF3DC" stroke="#C79A2E" stroke-width="2.2"/>
        <path d="M32 44 v8 M26 48 l6 4 6 -4" stroke="#C79A2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="label">LLM externe<br/>(Groq)</div>
    </div>

  </div>
</div>
