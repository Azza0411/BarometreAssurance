server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA : toute route inconnue retombe sur index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Flask (api/app.py, port 8002) - chemin deja prefixe /api/... cote Flask
    location /api/ {
        proxy_pass http://api:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Chatbot IA (chatbot_portable/app.py, port 5001)
    location /chatbot/ {
        proxy_pass http://chatbot:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
